<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Nuage de mots — écoute</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #ffffff;
    --panel-raised: #f4f5f6;
    --line: #dcdfe3;
    --line-strong: #b9bfc7;
    --ink: #15181c;
    --ink-dim: #6b7280;
    --accent: #1d3557;
    --accent-warm: #a8681c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  main{ max-width:420px; width:100%; text-align:center; }
  h1{
    font-size:17px; font-weight:700; margin:0 0 6px;
  }
  .sous-titre{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 32px;
  }
  .liens{ display:flex; flex-direction:column; gap:14px; }
  .lien-carte{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel-raised); border:1px solid var(--line-strong);
    border-radius:8px; padding:20px 18px; text-align:left;
    transition:border-color .15s;
  }
  .lien-carte:hover{ border-color:var(--accent); }
  .lien-titre{ font-size:15px; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .lien-desc{ font-size:12.5px; color:var(--ink-dim); line-height:1.5; }
  footer{
    margin-top:32px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-dim);
  }
</style>
</head>
<body>
<main>
  <h1>Nuage de mots — écoute musicale</h1>
  <p class="sous-titre">Vote collaboratif en classe</p>
  <div class="liens">
    <a class="lien-carte" href="eleve.html">
      <div class="lien-titre">Interface élève</div>
      <div class="lien-desc">À utiliser sur les tablettes, un onglet par groupe.</div>
    </a>
    <a class="lien-carte" href="prof.html">
      <div class="lien-titre">Interface professeur</div>
      <div class="lien-desc">Ouverture/clôture du vote, suivi des groupes, génération du commentaire.</div>
    </a>
  </div>
  <footer>jm voiront — outil pédagogique — usage classe</footer>
</main>
</body>
</html>
