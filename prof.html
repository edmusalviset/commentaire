<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Écoute — suivi professeur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-raised: #f4f5f6;
    --line: #dcdfe3;
    --line-strong: #b9bfc7;
    --ink: #15181c;
    --ink-dim: #6b7280;
    --accent: #1d3557;
    --accent-warm: #a8681c;
    --danger: #b3261e;
    --success: #2f7d4f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{ font-size:16px; font-weight:700; margin:0; color:var(--ink); }
  .status-line{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-dim);
  }
  .status-dot{ width:8px;height:8px;border-radius:50%; background:var(--danger); flex:none; }
  .status-dot.ouvert{ background:var(--success); }

  main{ flex:1; max-width:1000px; width:100%; margin:0 auto; padding:24px 24px 60px; }

  .panel-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }

  /* ---- Écran mot de passe ---- */
  .login-wrap{ max-width:340px; margin:80px auto; text-align:center; }
  .login-wrap p{ color:var(--ink-dim); font-size:13px; margin-bottom:16px; }
  .login-wrap input{
    width:100%; padding:10px 12px; font-size:14px;
    border:1px solid var(--line-strong); border-radius:4px;
    font-family:'Space Grotesk', sans-serif;
    margin-bottom:10px;
  }
  .login-wrap input:focus{ outline:none; border-color:var(--accent); }
  .login-wrap button{
    width:100%; padding:11px; background:var(--accent); border:1px solid var(--accent);
    color:#fff; font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.06em;
    border-radius:4px; cursor:pointer;
  }
  .login-wrap .erreur{ color:var(--danger); font-size:12px; margin-top:8px; min-height:16px; }

  /* ---- Contrôles écoute ---- */
  .controles{ display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
  .controles button{
    padding:12px 18px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.06em;
    border-radius:4px; cursor:pointer;
  }
  #nouvelleEcouteBtn{ background:var(--accent); border:1px solid var(--accent); color:#fff; }
  #nouvelleEcouteBtn:hover{ opacity:.85; }
  #cloturerBtn{ background:#fff; border:1px solid var(--danger); color:var(--danger); }
  #cloturerBtn:hover{ background:var(--danger); color:#fff; }
  .controles button:disabled{ opacity:.35; cursor:default; }

  /* ---- Grille des groupes ---- */
  .groupes-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr));
    gap:10px; margin-bottom:32px;
  }
  .groupe-card{
    border:1px solid var(--line-strong); border-radius:6px;
    padding:14px 8px; text-align:center;
    background:var(--panel-raised);
  }
  .groupe-card .num{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:700; color:var(--ink); }
  .groupe-card .etat{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; margin-top:6px; color:var(--ink-dim); }
  .groupe-card.termine{ background:#eaf5ee; border-color:var(--success); }
  .groupe-card.termine .etat{ color:var(--success); }
  .groupe-card.absent{ opacity:.45; }

  .message-etat{
    background:var(--panel-raised); border:1px solid var(--line); border-radius:6px;
    padding:22px; text-align:center; color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; line-height:1.6;
  }

  /* ---- Résultats : nuages de mots ---- */
  .rubrique-bloc{ margin-bottom:30px; }
  .rubrique-titre{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent-warm); margin-bottom:10px;
  }
  .nuage{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 10px;
    padding:16px; background:var(--panel-raised); border:1px solid var(--line); border-radius:6px;
    min-height:50px;
  }
  .nuage .vide{ color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:400; }

  .nuage-chip{
    background:#ffffff;
    border:1px solid var(--line-strong);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    line-height:1.2;
    white-space:nowrap;
  }
  .nuage-chip:hover{ border-color:var(--accent); }
  .nuage-chip.selected{ background:var(--accent); border-color:var(--accent); color:#ffffff; }
  .nuage-chip .compte{ font-family:'IBM Plex Mono', monospace; font-size:.7em; font-weight:400; opacity:.65; margin-left:3px; }

  .manuel-input{
    width:100%; max-width:320px; margin-top:8px;
    background:#ffffff; border:1px solid var(--line-strong); color:var(--ink);
    padding:7px 10px; font-family:'Space Grotesk', sans-serif; font-size:12.5px;
    border-radius:4px;
  }
  .manuel-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(29,53,87,.12); }
  .manuel-input::placeholder{ color:#9aa1aa; }

  /* ---- Formulaire de génération du prompt ---- */
  .field{ margin-bottom:14px; max-width:640px; }
  .field > label{ display:block; font-size:12px; color:var(--accent); margin-bottom:5px; font-weight:600; }
  .field textarea, .field input{
    width:100%; background:#ffffff; border:1px solid var(--line-strong); color:var(--ink);
    padding:9px 10px; font-family:'Space Grotesk', sans-serif; font-size:13.5px;
    border-radius:4px; resize:vertical;
  }
  .field textarea{ min-height:44px; line-height:1.4; }
  .field textarea:focus, .field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(29,53,87,.12); }

  .btn-row{ display:flex; gap:8px; margin-top:20px; max-width:640px; }
  .btn-row button{
    flex:1; padding:12px 8px; background:var(--accent); border:1px solid var(--accent); color:#fff;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.06em;
    border-radius:4px; cursor:pointer;
  }
  .btn-row button:hover{ opacity:.85; }
  .btn-row button:disabled{ opacity:.4; cursor:default; }

  .screen-wrap{ margin-top:22px; max-width:820px; }
  .screen{ background:var(--panel-raised); border:1px solid var(--line); border-radius:6px; padding:20px 22px; min-height:140px; }
  #output{ font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1.7; color:var(--ink); white-space:pre-wrap; margin:0; }
  #output.empty{ color:#9aa1aa; }
  #output.error{ color:var(--danger); }
  .screen-foot{ margin-top:12px; display:flex; justify-content:flex-end; }
  #copyBtn, #toggleVisibility{
    background:#fff; border:1px solid var(--line-strong); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em;
    padding:6px 12px; border-radius:4px; cursor:pointer; margin-left:8px;
  }
  #copyBtn:hover, #toggleVisibility:hover{ border-color:var(--accent); color:var(--accent); }

  .ai-open-row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:14px; max-width:640px; }
  .ai-open-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-dim); margin-right:2px; }
  .ai-chip{
    background:#fff; border:1px solid var(--line-strong); color:var(--ink); font-size:12px;
    padding:5px 12px; border-radius:20px; cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
  .ai-chip:hover{ border-color:var(--accent); background:var(--accent); color:#fff; }

  .classement-table{ display:flex; flex-direction:column; gap:6px; max-width:640px; }
  .classement-ligne{
    display:flex; align-items:center; gap:12px;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:6px;
    padding:10px 14px;
  }
  .classement-rang{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:14px;
    color:var(--accent); width:22px; flex:none;
  }
  .classement-groupe{ font-weight:600; width:90px; flex:none; }
  .classement-detail{ flex:1; font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; }
  .classement-score{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px; color:var(--accent); flex:none; }

  footer{
    text-align:center; padding:16px 24px 24px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-dim);
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ================= Connexion Supabase ================= */
const SUPABASE_URL = "https://bqwdphdmeugixmwgnioy.supabase.co";
const SUPABASE_KEY = "sb_publishable_GFw0dXrnZa-EJ8l3UxJ8Iw_QATaIi2Q";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MOT_DE_PASSE = "edmus";

async function getEcouteOuverte(){
  const { data, error } = await supabaseClient
    .from("ecoutes").select("*")
    .eq("ouvert", true)
    .order("cree_at", { ascending:false })
    .limit(1).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}

async function creerNouvelleEcoute(){
  const { data, error } = await supabaseClient
    .from("ecoutes").insert({ ouvert:true }).select().single();
  if(error){ console.error(error); return null; }
  return data;
}

async function cloturerEcoute(ecouteId){
  const { data, error } = await supabaseClient
    .from("ecoutes")
    .update({ ouvert:false, cloture_at:new Date().toISOString() })
    .eq("id", ecouteId).select().single();
  if(error){ console.error(error); return null; }
  return data;
}

async function getStatutGroupes(ecouteId){
  const { data, error } = await supabaseClient
    .from("reponses").select("groupe_numero, termine")
    .eq("ecoute_id", ecouteId)
    .order("groupe_numero", { ascending:true });
  if(error){ console.error(error); return []; }
  return data;
}

async function getReponsesCompletes(ecouteId){
  const { data, error } = await supabaseClient
    .from("reponses").select("groupe_numero, donnees, termine")
    .eq("ecoute_id", ecouteId)
    .order("groupe_numero", { ascending:true });
  if(error){ console.error(error); return []; }
  return data;
}

/* Groupes connectés récemment (salle d'attente) — calcul entièrement
   côté serveur Supabase, pour ne dépendre d'aucune horloge locale. */
async function getGroupesConnectes(){
  const { data, error } = await supabaseClient.rpc('get_groupes_connectes');
  if(error){ console.error(error); return []; }
  return data || [];
}

/* ================= Vocabulaire (labels pour l'affichage des résultats) ================= */
const RUBRIQUES_LABELS = {
  epoque: "Époque", tempo: "Tempo", nuances: "Nuances", caractere: "Caractère",
  effectifVocal: "Effectif vocal", effectifSolistes: "Effectif instr. — solistes",
  effectifEnsembles: "Effectif instr. — ensembles",
  plansSonores: "Plans sonores", forme: "Forme", genre: "Genre", style: "Style"
};
const ORDRE_RUBRIQUES = ["caractere","tempo","nuances","effectifVocal","effectifSolistes","effectifEnsembles","epoque","plansSonores","forme","genre","style"];

/* ================= État de l'appli ================= */
const app = document.getElementById('app');
let connecte = false;
let ecouteActuelle = null; // objet ecoute courant (ouverte ou dernière connue)
let derniereEcouteId = null;
let resultSelections = {}; // { rubriqueKey: Set(termes sélectionnés) }
let ecouteResultatsChargeeId = null; // id de l'écoute pour laquelle resultSelections a été initialisé
let resultatsAffichesPourId = null; // id de l'écoute pour laquelle l'écran résultats a déjà été construit
let derniereReponses = []; // réponses complètes de la dernière écoute clôturée affichée (pour le classement)

/* ================= Écran mot de passe ================= */
function afficherLogin(){
  app.innerHTML = `
    <header><h1>Suivi professeur</h1></header>
    <main>
      <div class="login-wrap">
        <p>Accès réservé au professeur.</p>
        <input type="password" id="pwdInput" placeholder="Mot de passe">
        <button id="pwdBtn" type="button">ENTRER</button>
        <div class="erreur" id="pwdErreur"></div>
      </div>
    </main>
  `;
  const input = document.getElementById('pwdInput');
  const btn = document.getElementById('pwdBtn');
  const erreur = document.getElementById('pwdErreur');
  function tenter(){
    if(input.value === MOT_DE_PASSE){
      connecte = true;
      afficherDashboard();
    }else{
      erreur.textContent = "Mot de passe incorrect.";
    }
  }
  btn.addEventListener('click', tenter);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tenter(); });
  input.focus();
}

/* ================= Dashboard principal ================= */
function afficherDashboard(){
  app.innerHTML = `
    <header>
      <h1>Suivi professeur</h1>
      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Chargement…</span>
      </div>
    </header>
    <main>
      <div class="controles">
        <button id="nouvelleEcouteBtn" type="button">NOUVELLE ÉCOUTE</button>
        <button id="cloturerBtn" type="button" disabled>CLÔTURER LE VOTE</button>
      </div>
      <div id="contenuPrincipal"></div>
    </main>
    <footer>jm voiront — outil pédagogique — usage classe</footer>
  `;
  document.getElementById('nouvelleEcouteBtn').addEventListener('click', lancerNouvelleEcoute);
  document.getElementById('cloturerBtn').addEventListener('click', cloturerVoteActuel);
  rafraichirDashboard();
  setInterval(rafraichirDashboard, 3000);
}

async function lancerNouvelleEcoute(){
  const ecoute = await creerNouvelleEcoute();
  if(ecoute){
    ecouteActuelle = ecoute;
    resultatsAffichesPourId = null;
    await rafraichirDashboard();
  }
}

async function cloturerVoteActuel(){
  if(!ecouteActuelle) return;
  const ecoute = await cloturerEcoute(ecouteActuelle.id);
  if(ecoute){
    ecouteActuelle = ecoute;
    await rafraichirDashboard();
  }
}

async function rafraichirDashboard(){
  if(!connecte) return;

  const ouverte = await getEcouteOuverte();
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const nouvelleEcouteBtn = document.getElementById('nouvelleEcouteBtn');
  const cloturerBtn = document.getElementById('cloturerBtn');
  const contenuPrincipal = document.getElementById('contenuPrincipal');
  if(!statusDot) return; // dashboard plus affiché (ex: après déconnexion)

  if(ouverte){
    // Une écoute est ouverte : priorité à son affichage même si on avait
    // une écoute clôturée affichée juste avant.
    ecouteActuelle = ouverte;
    statusDot.classList.add('ouvert');
    statusText.textContent = 'Vote en cours';
    nouvelleEcouteBtn.disabled = true;
    cloturerBtn.disabled = false;

    const statuts = await getStatutGroupes(ouverte.id);
    afficherGrilleGroupes(contenuPrincipal, statuts);
  }else{
    statusDot.classList.remove('ouvert');
    nouvelleEcouteBtn.disabled = false;
    cloturerBtn.disabled = true;

    if(ecouteActuelle && ecouteActuelle.cloture_at){
      // On vient de clôturer (ou on recharge la page juste après) : afficher
      // les résultats — mais UNE SEULE FOIS par écoute, pour ne pas écraser
      // en boucle (toutes les 3s) le formulaire en cours de remplissage.
      statusText.textContent = 'Vote clôturé';
      if(resultatsAffichesPourId !== ecouteActuelle.id){
        const reponses = await getReponsesCompletes(ecouteActuelle.id);
        afficherResultats(contenuPrincipal, reponses);
        resultatsAffichesPourId = ecouteActuelle.id;
      }
    }else{
      statusText.textContent = 'Aucun vote en cours';
      const connectes = await getGroupesConnectes();
      afficherSalleAttente(contenuPrincipal, connectes);
    }
  }
}

function afficherSalleAttente(container, connectes){
  let html = `<div class="message-etat" style="margin-bottom:20px;">Clique sur « Nouvelle écoute » pour ouvrir le vote aux élèves.</div>`;
  html += `<p class="panel-label">Groupes connectés (identifiés)</p><div class="groupes-grid">`;
  for(let i = 1; i <= 10; i++){
    const identifie = connectes.includes(i);
    html += `
      <div class="groupe-card ${identifie ? 'termine' : 'absent'}">
        <div class="num">${identifie ? '☑' : '☐'} ${i}</div>
        <div class="etat">${identifie ? 'Identifié' : 'Non identifié'}</div>
      </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

function afficherGrilleGroupes(container, statuts){
  const parStatut = {};
  statuts.forEach(s => parStatut[s.groupe_numero] = s.termine);

  let html = `<p class="panel-label">Groupes (1 à 10)</p><div class="groupes-grid">`;
  for(let i = 1; i <= 10; i++){
    const a_repondu = i in parStatut;
    const termine = parStatut[i] === true;
    const classe = termine ? 'termine' : (a_repondu ? '' : 'absent');
    const etat = termine ? 'Terminé' : (a_repondu ? 'En cours' : 'En attente');
    html += `
      <div class="groupe-card ${classe}">
        <div class="num">${i}</div>
        <div class="etat">${etat}</div>
      </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

function afficherResultats(container, reponses){
  if(reponses.length === 0){
    container.innerHTML = `<div class="message-etat">Aucune réponse n'a été enregistrée pour cette écoute.</div>`;
    return;
  }
  derniereReponses = reponses;

  // Recalcule les décomptes par rubrique
  const comptesParRubrique = {};
  ORDRE_RUBRIQUES.forEach(cle => {
    const compte = {};
    reponses.forEach(r => {
      (r.donnees[cle] || []).forEach(terme => {
        compte[terme] = (compte[terme] || 0) + 1;
      });
    });
    comptesParRubrique[cle] = compte;
  });

  // Réinitialise la sélection uniquement si c'est une nouvelle écoute clôturée
  if(ecouteResultatsChargeeId !== ecouteActuelle.id){
    resultSelections = {};
    ORDRE_RUBRIQUES.forEach(cle => resultSelections[cle] = new Set());
    ecouteResultatsChargeeId = ecouteActuelle.id;
  }

  let html = `<p class="panel-label">Sélectionner les termes à utiliser dans le commentaire</p>`;
  ORDRE_RUBRIQUES.forEach(cle => {
    const termes = Object.entries(comptesParRubrique[cle]).sort((a,b) => b[1]-a[1]);
    const maxCount = termes.length ? termes[0][1] : 0;

    html += `<div class="rubrique-bloc">
      <div class="rubrique-titre">${RUBRIQUES_LABELS[cle]}</div>
      <div class="nuage" data-rubrique="${cle}">`;
    if(termes.length === 0){
      html += `<span class="vide">Aucune réponse</span>`;
    }else{
      termes.forEach(([terme, n]) => {
        const taille = 12 + Math.round((n / maxCount) * 10); // 12px à 22px, lisible en chip
        const selectionne = resultSelections[cle].has(terme);
        html += `<button type="button" class="nuage-chip${selectionne ? ' selected' : ''}" data-cle="${cle}" data-terme="${terme.replace(/"/g,'&quot;')}" style="font-size:${taille}px">${terme}<span class="compte">${n}</span></button>`;
      });
    }
    html += `</div>
      <input type="text" class="manuel-input" id="manuel-${cle}" placeholder="Ajouter un terme non listé…">
    </div>`;
  });

  html += `
    <div class="section-divider">Informations sur l'écoute</div>
    <div class="field">
      <label for="problematique">Problématique de la séquence</label>
      <textarea id="problematique" placeholder="Ex. En quoi la musique peut-elle raconter une histoire sans les mots ?"></textarea>
    </div>
    <div class="field">
      <label for="titre">Titre de l'œuvre</label>
      <input id="titre" type="text" placeholder="Ex. Boléro">
    </div>
    <div class="field">
      <label for="compositeur">Compositeur</label>
      <input id="compositeur" type="text" placeholder="Ex. Maurice Ravel">
    </div>
    <div class="field">
      <label for="elements">Éléments permettant de répondre à la problématique</label>
      <textarea id="elements" placeholder="Ex. la répétition d'un même motif crée une tension qui monte jusqu'à l'explosion finale"></textarea>
    </div>
    <div class="btn-row">
      <button id="genererBtn" type="button">GÉNÉRER LE PROMPT</button>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button id="copyBtn" type="button" disabled>COPIER LE PROMPT</button>
      <button id="toggleVisibility" type="button" disabled>AFFICHER LE PROMPT</button>
    </div>
    <div class="ai-open-row">
      <span class="ai-open-label">Ouvrir dans :</span>
      <button class="ai-chip" type="button" data-url="https://claude.ai/new">Claude</button>
      <button class="ai-chip" type="button" data-url="https://gemini.google.com/app">Gemini</button>
      <button class="ai-chip" type="button" data-url="https://chatgpt.com/">ChatGPT</button>
      <button class="ai-chip" type="button" data-url="https://chat.mistral.ai/">Le Chat</button>
      <button class="ai-chip" type="button" data-url="https://copilot.microsoft.com/">Copilot</button>
    </div>
    <div class="screen-wrap" id="screenWrap" style="display:none;">
      <p class="panel-label">Prompt généré</p>
      <div class="screen"><p id="output" class="empty">En attente de paramètres…</p></div>
    </div>

    <div class="section-divider">Classement des groupes</div>
    <p style="font-size:12px; color:var(--ink-dim); max-width:600px; margin:-4px 0 12px;">
      Basé sur ta sélection actuelle dans les nuages de mots ci-dessus (les termes ajoutés en saisie libre ne comptent pour aucun groupe). Recalcule après avoir ajusté ta sélection.
    </p>
    <div class="btn-row" style="max-width:320px;">
      <button id="classementBtn" type="button">CALCULER LE CLASSEMENT</button>
    </div>
    <div id="classementZone" style="margin-top:14px;"></div>
  `;

  container.innerHTML = html;

  container.querySelectorAll('.nuage-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cle = chip.dataset.cle;
      const terme = chip.dataset.terme;
      if(resultSelections[cle].has(terme)){
        resultSelections[cle].delete(terme);
        chip.classList.remove('selected');
      }else{
        resultSelections[cle].add(terme);
        chip.classList.add('selected');
      }
    });
  });

  container.querySelectorAll('.ai-chip').forEach(btn => {
    btn.addEventListener('click', () => window.open(btn.dataset.url, '_blank'));
  });

  document.getElementById('genererBtn').addEventListener('click', genererPrompt);
  document.getElementById('classementBtn').addEventListener('click', afficherClassement);
  document.getElementById('copyBtn').addEventListener('click', copierPrompt);
  document.getElementById('toggleVisibility').addEventListener('click', () => {
    const screenWrap = document.getElementById('screenWrap');
    const btn = document.getElementById('toggleVisibility');
    const hidden = screenWrap.style.display === 'none';
    screenWrap.style.display = hidden ? '' : 'none';
    btn.textContent = hidden ? 'MASQUER LE PROMPT' : 'AFFICHER LE PROMPT';
  });
}

function joinNaturally(items){
  const arr = Array.from(items);
  if(arr.length === 0) return '';
  if(arr.length === 1) return arr[0];
  return arr.slice(0, -1).join(', ') + ' et ' + arr[arr.length - 1];
}

function buildPrompt(f){
  const lines = [];
  if(f.epoque)            lines.push(`Époque : ${f.epoque}`);
  if(f.tempo)             lines.push(`Tempo : ${f.tempo}`);
  if(f.nuances)           lines.push(`Nuances : ${f.nuances}`);
  if(f.caractere)         lines.push(`Caractère : ${f.caractere}`);
  if(f.effectifVocal)     lines.push(`Effectif vocal : ${f.effectifVocal}`);
  if(f.effectifSolistes)  lines.push(`Effectif instrumental (solistes) : ${f.effectifSolistes}`);
  if(f.effectifEnsembles) lines.push(`Effectif instrumental (ensembles) : ${f.effectifEnsembles}`);
  if(f.plansSonores)      lines.push(`Plans sonores : ${f.plansSonores}`);
  if(f.forme)             lines.push(`Forme : ${f.forme}`);
  if(f.genre)             lines.push(`Genre : ${f.genre}`);
  if(f.style)             lines.push(`Style : ${f.style}`);
  if(f.elements)          lines.push(`Éléments permettant de répondre à la problématique : ${f.elements}`);

  return `Rédige un très court commentaire d'écoute, destiné à des élèves de collège.
Le texte doit être rédigé comme une trace écrite d'élève : phrases simples, vocabulaire accessible, formulation naturelle et précise.
Consignes
·       Commencer obligatoirement par « Nous avons écouté… ».
·       Citer dès la première phrase le titre de l'œuvre et le compositeur.
·       Rédiger exactement 5 phrases courtes (une phrase = un sujet, un verbe conjugué ; éviter les phrases à plus de deux propositions).
·       Prendre en compte en priorité les paramètres d'audition suivants : tempo, nuances, caractère, effectif et époque.
·       Utiliser tels quels les termes de tempo et de nuances fournis ci-dessous (ex. allegro, largo, piano, forte, crescendo…) : ne pas les remplacer par des formulations approximatives comme « rapide », « lent » ou « moyennement fort ».
·       Si des paramètres complémentaires sont renseignés (plans sonores, forme, genre, style), les intégrer également au commentaire, sans dépasser 5 phrases et sans surcharger une phrase.
·       Ne pas simplement énumérer les paramètres : les mettre en relation pour expliquer ce que produit l'écoute. Si mettre deux paramètres en relation dans une même phrase la rendrait trop longue ou trop complexe pour un collégien, préférer deux phrases courtes reliées par le sens plutôt qu'une phrase longue à subordonnées.
·       Le caractère doit être mis en relation avec un ou plusieurs autres paramètres, notamment le tempo, les nuances et/ou l'effectif, selon ce qui est pertinent pour l'œuvre.
·       L'effectif doit être décrit simplement et peut être mis en relation avec le caractère lorsqu'il contribue à l'atmosphère ou à l'originalité de l'œuvre.
·       L'époque doit être formulée de manière suffisamment large et mise en relation avec les caractéristiques entendues.
·       La dernière phrase doit apporter une réponse à la problématique donnée, en s'appuyant explicitement sur au moins un des éléments listés dans « Éléments permettant de répondre à la problématique ».
·       Ne pas ajouter d'informations biographiques, historiques ou théoriques qui ne sont pas nécessaires pour répondre à la problématique.
·       Ne pas utiliser de vocabulaire trop technique ou trop complexe pour des élèves de collège, à l'exception des termes de tempo et de nuances qui doivent rester tels quels.
·       Ne pas ajouter de titre, de liste, d'explication ou de commentaire après les 5 phrases.
·       Vérifier avant de répondre que le texte compte exactement 5 phrases ; si ce n'est pas le cas, corriger avant de produire la réponse finale.
Informations sur l'écoute à utiliser
Problématique : ${f.problematique}
Titre de l'œuvre : ${f.titre}
Compositeur : ${f.compositeur}
${lines.join('\n')}
À partir de ces informations, rédige directement le commentaire final en 5 phrases courtes, en privilégiant les relations entre les paramètres plutôt que leur description séparée.`;
}

function afficherClassement(){
  const scores = derniereReponses.map(r => {
    let proposes = 0, retenus = 0;
    ORDRE_RUBRIQUES.forEach(cle => {
      const termesGroupe = r.donnees[cle] || [];
      proposes += termesGroupe.length;
      termesGroupe.forEach(t => { if(resultSelections[cle].has(t)) retenus++; });
    });
    const precision = proposes > 0 ? retenus / proposes : 0;
    const score = retenus * (1 + precision);
    return { groupe: r.groupe_numero, proposes, retenus, precision, score };
  }).sort((a,b) => b.score - a.score);

  let html = `<div class="classement-table">`;
  scores.forEach((s, i) => {
    html += `
      <div class="classement-ligne">
        <span class="classement-rang">${i+1}</span>
        <span class="classement-groupe">Groupe ${s.groupe}</span>
        <span class="classement-detail">${s.retenus} retenu(s) / ${s.proposes} proposé(s) — précision ${Math.round(s.precision*100)}%</span>
        <span class="classement-score">${s.score.toFixed(1)}</span>
      </div>`;
  });
  html += `</div>`;
  document.getElementById('classementZone').innerHTML = html;
}

function genererPrompt(){
  const f = {
    problematique: document.getElementById('problematique').value.trim(),
    titre: document.getElementById('titre').value.trim(),
    compositeur: document.getElementById('compositeur').value.trim(),
    elements: document.getElementById('elements').value.trim()
  };
  ORDRE_RUBRIQUES.forEach(cle => {
    const partiesSelection = Array.from(resultSelections[cle]);
    const manuelEl = document.getElementById('manuel-' + cle);
    const manuel = manuelEl ? manuelEl.value.trim() : '';
    if(manuel) partiesSelection.push(manuel);
    f[cle] = joinNaturally(partiesSelection);
  });

  const output = document.getElementById('output');
  const screenWrap = document.getElementById('screenWrap');
  const copyBtn = document.getElementById('copyBtn');
  const toggleBtn = document.getElementById('toggleVisibility');

  const manquants = ['titre','compositeur','problematique'].filter(k => !f[k]);
  if(manquants.length){
    output.className = 'error';
    output.textContent = 'Merci de renseigner au minimum la problématique, le titre et le compositeur.';
    copyBtn.disabled = true;
    toggleBtn.disabled = false;
    toggleBtn.textContent = 'MASQUER LE PROMPT';
    screenWrap.style.display = '';
    return;
  }

  output.className = '';
  output.textContent = buildPrompt(f);
  copyBtn.disabled = false;
  toggleBtn.disabled = false;
  toggleBtn.textContent = 'AFFICHER LE PROMPT';
  screenWrap.style.display = 'none';
}

function copierPrompt(){
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');
  if(!output.textContent || output.classList.contains('error')) return;
  const copier = text => {
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ const ok = document.execCommand('copy'); document.body.removeChild(ta); ok ? resolve() : reject(); }
      catch(err){ document.body.removeChild(ta); reject(err); }
    });
  };
  copier(output.textContent).then(() => {
    const old = copyBtn.textContent;
    copyBtn.textContent = 'COPIÉ';
    setTimeout(() => copyBtn.textContent = old, 1200);
  }).catch(() => {
    const old = copyBtn.textContent;
    copyBtn.textContent = 'ÉCHEC — copie manuellement';
    setTimeout(() => copyBtn.textContent = old, 2000);
  });
}
